kind = "web"
previewPath = "/"
title = "IoT Dashboard"
version = "1.0.0"
id = "artifacts/iot-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23411

[services.development]
run = "pnpm --filter @workspace/iot-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iot-dashboard", "run", "build" ]
publicDir = "artifacts/iot-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23411"
WEB_PORT = "23411"
BASE_PATH = "/"
