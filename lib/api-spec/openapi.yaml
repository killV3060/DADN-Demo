openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: IoT Dashboard API with RBAC
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: iot
    description: IoT sensor data and device control

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── IOT ─────────────────────────────────────────────────────────
  /data:
    get:
      operationId: getSensorData
      tags: [iot]
      summary: Get sensor data
      description: >
        Guest (no token): returns only temperature + humidity (luminosity is null).
        Admin / Developer: returns full sensor data including luminosity.
      responses:
        "200":
          description: Sensor data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorData"

  /control:
    post:
      operationId: sendCommand
      tags: [iot]
      summary: Send control command (Admin+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlCommand"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thresholds:
    get:
      operationId: getThresholds
      tags: [iot]
      summary: Get alert thresholds (Admin+)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thresholds"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setThresholds
      tags: [iot]
      summary: Update alert thresholds (Developer only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Thresholds"
      responses:
        "200":
          description: Thresholds updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thresholds"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connection:
    get:
      operationId: getConnectionStatus
      tags: [iot]
      summary: Get connection status (Admin+)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: connectDevice
      tags: [iot]
      summary: Connect to device (Admin+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectRequest"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
        "400":
          description: Connection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── AUTH SCHEMAS ─────────────────────────────────────────────
    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, developer]
      required: [id, username, role]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]

    # ─── IOT SCHEMAS ──────────────────────────────────────────────
    SensorData:
      type: object
      properties:
        temperature:
          type: ["number", "null"]
        humidity:
          type: ["number", "null"]
        luminosity:
          type: ["number", "null"]
        timestamp:
          type: ["string", "null"]
        warnings:
          type: object
          properties:
            temperatureHigh:
              type: boolean
            humidityLow:
              type: boolean
          required: [temperatureHigh, humidityLow]
      required: [temperature, humidity, luminosity, timestamp, warnings]

    ControlCommand:
      type: object
      properties:
        command:
          type: string
      required: [command]

    CommandResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    Thresholds:
      type: object
      properties:
        tempMax:
          type: number
        humidMin:
          type: number
      required: [tempMax, humidMin]

    ConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
        port:
          type: ["string", "null"]
        mode:
          type: ["string", "null"]
      required: [connected, port, mode]

    ConnectRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [demo, mqtt]
      required: [mode]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
