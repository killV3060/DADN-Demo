services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./artifacts/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yolobit_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yolobit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 8080
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:password@db:5432/yolobit_db
      MQTT_URL: mqtt://mqtt:1883
      MQTT_SENSOR_TOPIC: yolobit/sensor/+
      MQTT_COMMAND_TOPIC: yolobit/command
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment or .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  iot-dashboard:
    build:
      context: .
      dockerfile: artifacts/iot-dashboard/Dockerfile
      args:
        WEB_PORT: 80
        BASE_PATH: /
        API_PORT: 8080
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "80:80"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./artifacts/iot-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: