version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yolobit_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yolobit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 8080
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:password@db:5432/yolobit_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  iot-dashboard:
    build:
      context: .
      dockerfile: artifacts/iot-dashboard/Dockerfile
      args:
        WEB_PORT: 80
        BASE_PATH: /
        API_PORT: 8080
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "80:80"

volumes:
  postgres_data: