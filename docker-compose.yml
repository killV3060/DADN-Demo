services:
  postgres:
    image: postgres:16-alpine
    container_name: yolobit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yolobit
      POSTGRES_PASSWORD: yolobit
      POSTGRES_DB: yolobit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolobit -d yolobit"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: yolobit-mosquitto
    restart: unless-stopped
    volumes:
      - ./artifacts/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"

  api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: yolobit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: "8080"
      DATABASE_URL: postgres://yolobit:yolobit@postgres:5432/yolobit
      PGHOST: postgres
      PGPORT: "5432"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_SENSOR_TOPIC: yolobit/sensor/+
      MQTT_COMMAND_TOPIC: yolobit/command
      DEVICE_ID: "1"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: yolobit-web
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "23411:80"

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
